<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSense - Smart Fall Detection</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">🛡️</div>
                <h1>SafeSense</h1>
                <p>Smart Fall Detection & Monitoring System</p>
                <div class="made-in-india">🇮🇳 Made in India</div>
            </div>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">👤 Full Name</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="phone">📱 Mobile Number</label>
                    <div class="phone-input-container">
                        <span class="country-code">+91</span>
                        <input type="tel" id="phone" name="phone" required 
                               placeholder="Enter 10-digit mobile number"
                               maxlength="10" 
                               inputmode="numeric">
                    </div>
                    <small class="input-help">Enter your 10-digit Indian mobile number (starting with 6-9)</small>
                </div>
                
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="darkMode" name="darkMode">
                        <span class="checkmark">🌙</span>
                        Enable Dark Mode
                    </label>
                </div>
                
                <button type="submit" class="login-btn">
                    <span class="btn-icon">🛡️</span>
                    <span class="btn-text">Start SafeSense</span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>Your information is stored locally and never shared</p>
            </div>
        </div>
        
        <div class="background-animation">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
